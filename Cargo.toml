[package]
name = "message-bus-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
async-stream = "0.3.6"
bytes = "1.11.0"
futures = "0.3.31"
futures-util = "0.3.31"
rand = "0.9.2"
reqwest = { version = "0.13.1", features = ["form", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["full"] }
tokio-util = "0.7.18"
